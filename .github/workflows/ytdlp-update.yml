name: Предложение обновления yt-dlp

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Установка инструментов
        run: |
          python -m pip install uv==0.11.21
          python -m pip install --requirement requirements-dev.txt
      - name: Подготовка точного обновления
        id: version
        run: |
          version=$(python scripts/find_latest_ytdlp.py)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          python scripts/update_ytdlp.py "$version"
      - name: Создание PR при изменении версии
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git diff --quiet; then
            echo "Текущая nightly уже закреплена"
            exit 0
          fi
          branch="mzx/update-ytdlp-${VERSION}"
          if [[ $(gh pr list --head "$branch" --state open --json number --jq 'length') -gt 0 ]]; then
            echo "PR для версии уже открыт"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add requirements.in requirements.txt requirements-dev.txt AGENTS.md docs/PRD.md docs/technical/youtube-download-runbook.md
          git commit -m "Обновить yt-dlp до ${VERSION}"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Обновить yt-dlp до ${VERSION}" \
            --body "Точная nightly-версия, lock-файлы с хешами и локальные проверки. CI собирает образ; сетевой YouTube smoke запускается отдельно."
