name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Линтинг
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Установка ruff
        run: pip install ruff

      - name: Проверка стиля кода
        run: ruff check --output-format=github .

  test:
    name: Тесты (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Полный набор тестов с покрытием
        run: |
          coverage run --branch -m pytest tests/
          coverage report --fail-under=40

  docker-build:
    name: Проверка Docker-сборки
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Проверка Compose
        env:
          NUVIO_ENV_FILE: /dev/null
          TELEGRAM_API_ID: "12345"
          TELEGRAM_API_HASH: test-api-hash
        run: docker compose -f compose.yaml config --quiet

      - name: Сборка образа Nuvio
        run: docker build -t nuvio:test .

      - name: Сборка локального Telegram Bot API
        run: docker build -f Dockerfile.telegram-bot-api -t nuvio-telegram-bot-api:test .

      - name: Проверка исполняемого файла Telegram Bot API
        run: docker run --rm nuvio-telegram-bot-api:test --version

      - name: Запуск WebUI из собранного образа
        run: |
          docker run --detach --name nuvio-web-smoke \
            --publish 127.0.0.1:18080:8080 \
            nuvio:test python -m web
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs nuvio-web-smoke
          exit 1

      - name: Остановка WebUI smoke-контейнера
        if: always()
        run: docker rm --force nuvio-web-smoke || true
