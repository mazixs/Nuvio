name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Линтинг
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Установка ruff
        run: pip install ruff

      - name: Проверка стиля кода
        run: ruff check --output-format=github .

  test:
    name: Тесты (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Синтаксис и юнит-тесты
        run: pytest tests/ -v -m "syntax or unit" --tb=short

  docker-build:
    name: Проверка Docker-сборки
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Проверка Compose
        env:
          NUVIO_ENV_FILE: /dev/null
          TELEGRAM_API_ID: "12345"
          TELEGRAM_API_HASH: test-api-hash
        run: docker compose -f compose.yaml config --quiet

      - name: Сборка образа Nuvio
        run: docker build -t nuvio:test .

      - name: Сборка локального Telegram Bot API
        run: docker build -f Dockerfile.telegram-bot-api -t nuvio-telegram-bot-api:test .
