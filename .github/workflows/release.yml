name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VALID_TAG_REGEX: '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

jobs:
  # ── Тесты перед релизом ──────────────────────────────
  test:
    name: Тесты перед релизом
    runs-on: ubuntu-latest
    steps:
      - name: Проверка формата тега
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ $VALID_TAG_REGEX ]]; then
            echo "Некорректный тег релиза: $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Установка зависимостей
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Проверка стиля
        run: ruff check --output-format=github .

      - name: Полный набор тестов с покрытием
        run: |
          coverage run --branch -m pytest tests/
          coverage report --fail-under=40

  # ── Changelog + GitHub Release ────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Метаданные версии
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Генерация changelog
        id: changelog
        run: |
          # Находим предыдущий тег
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | head -2 | tail -1)
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          if [ "$PREV_TAG" = "$CURRENT_TAG" ] || [ -z "$PREV_TAG" ]; then
            # Первый релиз — все коммиты
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          fi

          echo "Диапазон коммитов: $RANGE"

          # Собираем коммиты по категориям
          {
            echo "changelog<<CHANGELOG_EOF"

            # Features
            FEAT=$(git log "$RANGE" --pretty=format:"- %s" --grep="^feat" --grep="^add" --grep="добавл" -i 2>/dev/null || true)
            if [ -n "$FEAT" ]; then
              echo "### ✨ Новое"
              echo "$FEAT"
              echo ""
            fi

            # Fixes
            FIX=$(git log "$RANGE" --pretty=format:"- %s" --grep="^fix" --grep="исправ" --grep="починк" -i 2>/dev/null || true)
            if [ -n "$FIX" ]; then
              echo "### 🐛 Исправления"
              echo "$FIX"
              echo ""
            fi

            # Other changes (all commits not matching above)
            OTHER=$(git log "$RANGE" --pretty=format:"- %s" 2>/dev/null || true)
            if [ -n "$OTHER" ]; then
              echo "### 📦 Все изменения"
              echo "$OTHER"
              echo ""
            fi

            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Создание GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Nuvio v${{ steps.meta.outputs.version }}"
          tag_name: ${{ steps.meta.outputs.tag }}
          body: |
            ## 🚀 Nuvio v${{ steps.meta.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}

            ---

            ### 📥 Установка

            **Docker (рекомендуется):**
            ```bash
            git clone --branch v${{ steps.meta.outputs.version }} --depth 1 https://github.com/${{ github.repository }}.git
            cd Nuvio
            mkdir -p .secrets
            cp .env.example .secrets/.env
            # заполнить TELEGRAM_TOKEN, ADMIN_IDS, TELEGRAM_API_ID и TELEGRAM_API_HASH
            TAG=${{ steps.meta.outputs.version }} docker compose --env-file .secrets/.env up -d
            ```

            **Git:**
            ```bash
            git clone --branch v${{ steps.meta.outputs.version }} --depth 1 https://github.com/${{ github.repository }}.git
            cd Nuvio
            mkdir -p .secrets
            cp .env.example .secrets/.env  # настроить переменные
            pip install -r requirements.txt
            python main.py  # облачный Bot API, лимит отправки 50 МБ
            ```
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true

  # ── Docker → GHCR ────────────────────────────────────
  docker:
    name: Docker → GHCR
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - name: Локальная сборка образа для smoke-проверки
        run: docker build -t nuvio:release-test .

      - name: Smoke-проверка WebUI
        run: |
          docker run --detach --name nuvio-release-smoke \
            --publish 127.0.0.1:18080:8080 \
            nuvio:release-test python -m web
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs nuvio-release-smoke
          exit 1

      - name: Остановка release smoke-контейнера
        if: always()
        run: docker rm --force nuvio-release-smoke || true

      - name: Авторизация в GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метаданные Docker
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Сборка и пуш образа
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
